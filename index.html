<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 For Nang Khan Mon Mon</title>

<style>
body{
  margin:0;
  overflow:hidden;
  height:100vh;
  background: radial-gradient(circle at center,#0b0015,#000);
  font-family: Arial;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

/* glow core */
.aura{
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,pink,transparent 60%);
  filter:blur(60px);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:pulse 5s infinite;
}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.5);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

#tap{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.5);
  z-index:10;
  color:pink;
  font-size:18px;
  text-align:center;
}

#note{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  color:#ffb6c1;
  font-size:12px;
  opacity:0;
  transition:2s;
}
</style>
</head>

<body>

<div class="aura"></div>
<canvas id="c"></canvas>

<div id="tap" onclick="start()">💖 TAP TO START 💖</div>
<div id="note">💡 Watch stars form into heart… then tap 💖</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles=[];
let stage=0;

/* STAR PARTICLE */
class P{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.tx=x;
    this.ty=y;
  }

  update(){
    this.x+=(this.tx-this.x)*0.05;
    this.y+=(this.ty-this.y)*0.05;
  }

  draw(){
    ctx.fillStyle="white";
    ctx.shadowBlur=10;
    ctx.shadowColor="pink";
    ctx.fillRect(this.x,this.y,2,2);
  }
}

function reset(){
  particles=[];
}

/* ---------- STAR FALLING ---------- */
function starRain(){
  reset();

  for(let i=0;i<600;i++){
    let x=Math.random()*canvas.width;
    let y=Math.random()*canvas.height;

    let p=new P(x,-Math.random()*canvas.height);
    p.tx=x;
    p.ty=y;

    particles.push(p);
  }
}

/* ---------- FORM HEART FROM STARS ---------- */
function formHeart(){
  let scale=Math.min(canvas.width,canvas.height)/25;

  particles.forEach((p,i)=>{
    let t=(i/particles.length)*Math.PI*2;

    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

    p.tx=canvas.width/2 + x*scale;
    p.ty=canvas.height/2 + y*scale;
  });
}

/* ---------- EXPLODE HEART ---------- */
function explode(){
  particles.forEach(p=>{
    p.tx=Math.random()*canvas.width;
    p.ty=Math.random()*canvas.height;
  });
}

/* ---------- LETTER ---------- */
function formText(){
  reset();

  const text=[
    "💖 I LOVE YOU NANG KHAN MON MON 💖",
    "",
    "Thank you for your voice messages,",
    "your time, your care, and your support.",
    "",
    "I feel less alone because of you.",
    "Most of the time I have no one to talk to,",
    "but you stayed and listened.",
    "",
    "Please don’t stress yourself too much.",
    "You deserve peace and happiness every day.",
    "",
    "I will always care for you.",
    "Always stay with you 💖"
  ];

  let yStart=120;

  text.forEach((line,i)=>{
    drawLine(line,yStart+i*45);
  });
}

function drawLine(text,y){
  let temp=document.createElement("canvas");
  let tctx=temp.getContext("2d");

  temp.width=canvas.width;
  temp.height=100;

  tctx.font="28px Arial";
  tctx.fillStyle="white";

  let x=(canvas.width - tctx.measureText(text).width)/2;
  tctx.fillText(text,x,50);

  let data=tctx.getImageData(0,0,temp.width,temp.height).data;

  for(let y2=0;y2<temp.height;y2+=3){
    for(let x2=0;x2<temp.width;x2+=3){
      let i=(y2*temp.width+x2)*4;

      if(data[i+3]>150){
        let p=new P(Math.random()*canvas.width,Math.random()*canvas.height);
        p.tx=x2;
        p.ty=y2+y;
        particles.push(p);
      }
    }
  }
}

/* ---------- ANIMATE ---------- */
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  requestAnimationFrame(animate);
}
animate();

/* ---------- FLOW ---------- */
function start(){
  document.getElementById("tap").style.display="none";
  document.getElementById("note").style.opacity=1;

  starRain();
}

/* TAP CONTROL */
window.addEventListener("click",()=>{
  if(stage===0){
    stage=1;
    formHeart(); // stars become heart
  }
  else if(stage===1){
    stage=2;
    explode();   // heart breaks
    setTimeout(formText,900);
  }
});
</script>

</body>
</html>
